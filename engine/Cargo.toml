[package]
name = "suisho-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Suisho's math engine: exact arithmetic, parser, step-by-step solutions, plotting; JSON-lines bridge for the QML window"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
